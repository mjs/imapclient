[project]
name = "IMAPClient"
description = "Easy-to-use, Pythonic and complete IMAP client library"
version = "4.0.1"
authors = [
    {name = "Menno Finlay-Smits", email = "hello@menno.io"},
]
maintainers = [
    {name = "IMAPClient Maintainers", email = "imapclient@groups.io"},
]
keywords = ["imap", "client", "email", "mail"]
requires-python = ">=3.8.0"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Natural Language :: English",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Email :: Post-Office :: IMAP",
    "Topic :: Internet",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Networking",
]
readme = "README.rst"

[project.urls]
Homepage = "https://github.com/mjs/imapclient/"

[project.scripts]
imapclient-interact = "imapclient.interact:main"
imapclient-livetest = "imapclient.livetest:main"

[dependency-groups]
dev = [
    "sphinx",
    "black",
    "flake8",
    "isort",
    "mypy",
    "pylint",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["imapclient"]

[tool.setuptools.package-data]
imapclient = ["examples/*.py"]

[tool.isort]
profile = "black"
multi_line_output = 3
order_by_type = false

[tool.mypy]
files = "."
exclude = [
    "doc/.*",
    "examples/.*",
    "tests/.*",
]

show_error_codes = true

# 'strict = true' is equivalent to:
#   --check-untyped-defs
#   --disallow-any-generics
#   --disallow-incomplete-defs
#   --disallow-subclassing-any
#   --disallow-untyped-calls
#   --disallow-untyped-decorators
#   --disallow-untyped-defs
#   --extra-checks
#   --no-implicit-reexport
#   --strict-equality
#   --warn-redundant-casts
#   --warn-return-any
#   --warn-unused-configs
#   --warn-unused-ignores

check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
extra_checks = true
no_implicit_reexport = true
strict_equality = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true

# Overrides for currently untyped modules
[[tool.mypy.overrides]]
module = [
    "imapclient.imapclient",
    "imapclient.livetest",
]
ignore_errors = true

[tool.pylint.main]
# livetest.py isn't held to the same code quality standards as the rest of
# the package - it was historically not linted at all (it lived outside the
# imapclient package before becoming the imapclient-livetest script).
ignore-paths = ["imapclient/livetest.py"]

[tool.pylint.messages_control]
max-line-length = 88
jobs = 0  # Use auto-detected number of multiple processes to speed up Pylint.
# TODO(jlvillal): Work on removing these disables over time.
disable = [
    "attribute-defined-outside-init",
    "broad-exception-caught",
    "consider-using-f-string",
    "consider-using-ternary",
    "deprecated-method",
    "fixme",
    "import-error",
    "import-outside-toplevel",
    "inconsistent-return-statements",
    "invalid-name",
    "line-too-long",
    "missing-class-docstring",
    "missing-function-docstring",
    "missing-module-docstring",
    "no-value-for-parameter",
    "protected-access",
    "raise-missing-from",
    "signature-differs",
    "simplifiable-if-statement",
    "too-few-public-methods",
    "too-many-arguments",
    "too-many-boolean-expressions",
    "too-many-branches",
    "too-many-instance-attributes",
    "too-many-lines",
    "too-many-positional-arguments",
    "too-many-public-methods",
    "try-except-raise",
    "undefined-loop-variable",
    "unused-argument",
]
